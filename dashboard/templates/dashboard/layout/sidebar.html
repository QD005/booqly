{% load static %}
<div class="sidenav-menu">
<!-- Brand Logo -->
<a href=" {% static 'index.html' %} " class="logo">
    <span class="logo logo-light">
        <span class="logo-lg">BooqlyAI</span>
        <span class="logo-sm">BooqlyAI</span>
    </span>

    <span class="logo logo-dark">
        <span class="logo-lg"><img src=" {% static 'assets/images/logo-black.png' %} " alt="dark logo" /></span>
        <span class="logo-sm"><img src=" {% static 'assets/images/logo-sm.png' %} " alt="small logo" /></span>
    </span>
</a>

<!-- Sidebar Hover Menu Toggle Button -->
<button class="button-on-hover">
    <span class="btn-on-hover-icon"></span>
</button>

<!-- Full Sidebar Menu Close Button -->
<button class="button-close-offcanvas">
    <i class="ti ti-menu-4 align-middle"></i>
</button>

<div class="scrollbar" data-simplebar="">
    <div id="user-profile-settings" class="sidenav-user" style="background: url( {% static 'assets/images/user-bg-pattern.svg' %} )">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <a href=" {% static '#!' %} " class="link-reset">
                    <img src=" {% static 'assets/images/users/user-1.jpg' %} " alt="user-image" class="rounded-circle mb-2 avatar-md" />
                    <span class="sidenav-user-name fw-bold">David Dev</span>
                    <span class="fs-12 fw-semibold" data-lang="user-role">Art Director</span>
                </a>
            </div>
            <div>
                <a class="dropdown-toggle drop-arrow-none link-reset sidenav-user-set-icon" data-bs-toggle="dropdown" data-bs-offset="0,12" href=" {% static '#!' %} " aria-haspopup="false" aria-expanded="false">
                    <i class="ti ti-settings fs-24 align-middle ms-1"></i>
                </a>

                <div class="dropdown-menu">
                    <!-- Header -->
                    <div class="dropdown-header noti-title">
                        <h6 class="text-overflow m-0">Welcome back!</h6>
                    </div>

                    <!-- My Profile -->
                    <a href=" {% static '#!' %} " class="dropdown-item">
                        <i class="ti ti-user-circle me-1 fs-lg align-middle"></i>
                        <span class="align-middle">Profile</span>
                    </a>

                    <!-- Settings -->
                    <a href=" {% static 'javascript:void(0);' %} " class="dropdown-item">
                        <i class="ti ti-settings-2 me-1 fs-lg align-middle"></i>
                        <span class="align-middle">Account Settings</span>
                    </a>

                    <!-- Lock -->
                    <a href=" {% static 'auth-lock-screen.html' %} " class="dropdown-item">
                        <i class="ti ti-lock me-1 fs-lg align-middle"></i>
                        <span class="align-middle">Lock Screen</span>
                    </a>

                    <!-- Logout -->
                    <a href=" {% static 'javascript:void(0);' %} " class="dropdown-item text-danger fw-semibold">
                        <i class="ti ti-logout me-1 fs-lg align-middle"></i>
                        <span class="align-middle">Log Out</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!--- Sidenav Menu -->
    <div id="sidenav-menu">
        <ul class="side-nav">
            <li class="side-nav-title mt-2" data-lang="main">Main</li>
            <li class="side-nav-item">
                <a href="#" class="side-nav-link">
                    <span class="menu-icon"><i class="ti ti-dashboard"></i></span>
                    <span class="menu-text" data-lang="apps-chat">Dashboard</span>
                </a>
            </li>
            <li class="side-nav-item">
                <a href="#" class="side-nav-link">
                    <span class="menu-icon"><i class="ti ti-message"></i></span>
                    <span class="menu-text" data-lang="apps-chat">Integrations Hub</span>
                </a>
            </li>
            <li class="side-nav-item">
                <a href="#" class="side-nav-link">
                    <span class="menu-icon"><i class="ti ti-message"></i></span>
                    <span class="menu-text" data-lang="apps-chat">Service providers</span>
                </a>
            </li>         
            <li class="side-nav-title mt-2" data-lang="apps">Apps</li>
            
            <li class="side-nav-item">
                <a href="#" class="side-nav-link">
                    <span class="menu-icon"><i class="ti ti-message"></i></span>
                    <span class="menu-text" data-lang="apps-chat">Platform Integrations</span>
                </a>
            </li>
            <li class="side-nav-item">
                <a href="#" class="side-nav-link">
                    <span class="menu-icon"><i class="ti ti-message"></i></span>
                    <span class="menu-text" data-lang="apps-chat">User Management</span>
                </a>
            </li>  
        </ul>
    </div>
</div>
</div>

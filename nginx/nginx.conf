# ── nginx.conf (Production) ────────────────────────────────────────────────
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream to Django Gunicorn
    upstream django {
        server web:8000;
    }

    # HTTP → HTTPS redirect (before SSL is set up, comment this out)
    server {
        listen 80;
        server_name _;  # Accept any server name

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Uncomment AFTER SSL is set up:
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        # Comment OUT after SSL is set up:
        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS Server (uncomment AFTER SSL certificate is obtained)
    # server {
    #     listen 443 ssl;
    #     server_name yourdomain.com www.yourdomain.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers on;
    #
    #     # Security headers
    #     add_header X-Frame-Options "SAMEORIGIN" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header X-XSS-Protection "1; mode=block" always;
    #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #
    #     # Static files (served directly by Nginx, not Django)
    #     location /static/ {
    #         alias /app/staticfiles/;
    #         expires 30d;
    #         add_header Cache-Control "public, immutable";
    #     }
    #
    #     # Media files
    #     location /media/ {
    #         alias /app/media/;
    #         expires 30d;
    #     }
    #
    #     # Proxy everything else to Django
    #     location / {
    #         proxy_pass http://django;
